[project]
name = "photo-router"
version = "0.1.0"
description = "Safely organize JPEG photos into year-based archive folders"
readme = "README.md"
authors = [
    { name = "Marco Wegner", email = "673439+marvey11@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
    "codescape-shared-pie",
    "core",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
core = { path = "../../libs/core", editable = true }
codescape-shared-pie = { git = "https://github.com/marvey11/codescape-shared-pie.git", tag = "v0.1.2" }

[project.scripts]
photo-router = "photo_router.main:app"
