repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: local
    hooks:
      - id: document-router-lock
        name: document-router lock
        entry: uv lock --check --project apps/document-router
        language: system
        pass_filenames: false

      - id: photo-router-lock
        name: photo-router lock
        entry: uv lock --check --project apps/photo-router
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: scripts/run_mypy.sh
        language: system
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: scripts/run_pyright.sh
        language: system
        pass_filenames: false

      # Run test suite across workspace before push
      - id: pytest
        name: pytest
        entry: ./scripts/run_coverage.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
