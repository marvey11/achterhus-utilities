repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        pass_filenames: false
        always_run: true
      - id: ruff-format
        args: ["--check"]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: local
    hooks:
      - id: check-locks
        name: check-locks
        entry: ./scripts/check-locks.sh
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: ./scripts/run-mypy.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: pyright
        entry: ./scripts/run-pyright.sh
        language: system
        pass_filenames: false
        always_run: true

      # Run test suite across workspace before push
      - id: pytest
        name: pytest
        entry: ./scripts/run-coverage.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
