version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/document-router"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "core"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/apps/photo-router"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "core"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
