name: CI

on:
  push:
    branches: [main]
    tags:
      - "document-router-v*"
      - "photo-router-v*"
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true

      - name: Install Document Router dependencies
        run: uv sync --project apps/document-router --locked --group dev

      - name: Install Photo Router dependencies
        run: uv sync --project apps/photo-router --locked --group dev

      - name: Validate release tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(document-router|photo-router)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$RELEASE_TAG' must match <application-name>-v<major>.<minor>.<patch>." >&2
            exit 1
          fi

      - name: Run repository checks with Document Router
        run: uv run --project apps/document-router pre-commit run --all-files

      - name: Run repository checks with Photo Router
        run: uv run --project apps/photo-router pre-commit run --all-files

      - name: Run test suite and coverage
        run: ./scripts/run_coverage.sh

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        app: [document-router, photo-router]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract application release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          APP_NAME: ${{ matrix.app }}
        run: |
          version="0.0.0"
          major_minor="0.0"
          major="0"
          publish="false"

          if [[ "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_REF" == refs/tags/* ]] \
            && [[ "$RELEASE_TAG" == "${APP_NAME}-v"* ]] \
            && [[ "$RELEASE_TAG" =~ ^${APP_NAME}-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="$major.$minor.$patch"
            major_minor="$major.$minor"
            publish="true"
          elif [[ "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_REF" == refs/tags/* ]] \
            && [[ "$RELEASE_TAG" == "${APP_NAME}-v"* ]]; then
            echo "Release tag '$RELEASE_TAG' does not match ${APP_NAME}-v<major>.<minor>.<patch>." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || (github.event_name == 'release' && steps.release.outputs.publish == 'true')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: github.event_name != 'release' || steps.release.outputs.publish == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.publish == 'true' }}
            type=raw,value=${{ steps.release.outputs.major_minor }},enable=${{ steps.release.outputs.publish == 'true' }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.publish == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: github.event_name != 'release' || steps.release.outputs.publish == 'true'
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
